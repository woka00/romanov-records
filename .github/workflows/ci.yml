name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -cover ./...
      - run: go vet ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: romanov
          POSTGRES_PASSWORD: romanov
          POSTGRES_DB: romanov_records
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U romanov -d romanov_records"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://romanov:romanov@localhost:5432/romanov_records?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - run: migrate -path backend/migrations -database "$TEST_DATABASE_URL" up
      - run: go test -tags=integration ./internal/features/bookings/repository
        working-directory: backend

  compose:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
